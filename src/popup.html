<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Flow Tracker - A Magical Time Manager</title>
  <meta
    name="description"
    content="This is a Chrome extension to help people log their time spent on their browser and avoid distractive websites."
  />
</head>
<body>
  <header>
    <h1>Focus Flow Tracker</h1>
    <p>A magical productivity chrome extension.</p>

      <h2>Loading...</h2>
      <p>Please wait while the extension loads your focus flow data.</p>
    </section>
  </main>

  <footer>
    <small>Version 1.0.0 | It's Built for Focus & Productivity</small>
    <br />
    <small>Created by [My Name] | 2025</small>
  </footer>

  <!-- ✅ Ensure React bundle gets loaded -->
  <script type="module" src="popup.js"></script>
</body>
</html>
